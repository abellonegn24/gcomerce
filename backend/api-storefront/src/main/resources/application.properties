# =============================================================================
# Gadaa Istar Storefront API — Quarkus configuration
#
# Overrides come from environment variables (see ../../../../../.env.example).
# Profile-specific values live under `%dev`, `%test`, `%prod`.
# =============================================================================

# --- App identity ---
quarkus.application.name=gadaa-istar-storefront
quarkus.application.version=0.1.0-SNAPSHOT

# --- Scan shared web-common module for CDI beans and @Provider classes ---
quarkus.index-dependency.web-common.group-id=com.gadaaistar
quarkus.index-dependency.web-common.artifact-id=web-common
quarkus.index-dependency.persistence.group-id=com.gadaaistar
quarkus.index-dependency.persistence.artifact-id=persistence

# --- HTTP ---
quarkus.http.port=${QUARKUS_HTTP_PORT:8080}
quarkus.http.cors=true
quarkus.http.cors.origins=${STOREFRONT_BASE_URL:http://localhost:4200},${ADMIN_BASE_URL:http://localhost:4300}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Accept,Authorization,Content-Type,Idempotency-Key,X-Requested-With,X-Correlation-Id
quarkus.http.cors.access-control-allow-credentials=true

# --- Datasource ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:postgres}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:admin123}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_URL:jdbc:postgresql://localhost:5432/GCOMERCE}
quarkus.datasource.jdbc.max-size=20
quarkus.datasource.jdbc.min-size=2

# --- Hibernate ORM ---
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# --- Flyway ---
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.table=flyway_schema_history

# --- OpenAPI / Swagger ---
quarkus.smallrye-openapi.info-title=Gadaa Istar Storefront API
quarkus.smallrye-openapi.info-version=v1
quarkus.smallrye-openapi.info-description=Public and customer-facing REST API for the Gadaa Istar export e-commerce platform.
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# --- Health / Metrics ---
quarkus.smallrye-health.root-path=/q/health
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# --- Mailer (defaults to MailHog in dev) ---
quarkus.mailer.from=${SMTP_FROM_ADDRESS:noreply@gadaaistar.com}
quarkus.mailer.host=${SMTP_HOST:localhost}
quarkus.mailer.port=${SMTP_PORT:1025}
quarkus.mailer.username=${SMTP_USERNAME:}
quarkus.mailer.password=${SMTP_PASSWORD:}
quarkus.mailer.start-tls=DISABLED
quarkus.mailer.mock=false

# --- Logging ---
quarkus.log.level=${QUARKUS_LOG_LEVEL:INFO}
quarkus.log.category."com.gadaaistar".level=DEBUG
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%c{2.}] (%t) %s%e%n

# --- CyberSource (loaded via env vars, empty defaults) ---
gadaa.cybersource.env=${CYBERSOURCE_ENV:test}
gadaa.cybersource.endpoint=${CYBERSOURCE_ENDPOINT:https://testsecureacceptance.cybersource.com/pay}
gadaa.cybersource.access-key=${CYBERSOURCE_ACCESS_KEY: }
gadaa.cybersource.profile-id=${CYBERSOURCE_PROFILE_ID: }
gadaa.cybersource.secret-key=${CYBERSOURCE_SECRET_KEY: }
gadaa.cybersource.merchant-id=${CYBERSOURCE_MERCHANT_ID: }
gadaa.cybersource.rest-host=${CYBERSOURCE_REST_HOST:apitest.cybersource.com}

# --- MPGS (Mastercard Payment Gateway Services) Hosted Checkout ---
# Feature flag — set to true to offer MPGS as a payment option at checkout.
gadaa.mpgs.enabled=${MPGS_ENABLED:false}
# Gateway URL varies by provider/region. Default is the Mastercard test gateway.
gadaa.mpgs.gateway-url=${MPGS_GATEWAY_URL:https://test-gateway.mastercard.com}
gadaa.mpgs.merchant-id=${MPGS_MERCHANT_ID: }
gadaa.mpgs.api-password=${MPGS_API_PASSWORD: }
gadaa.mpgs.api-version=${MPGS_API_VERSION:62}
gadaa.mpgs.checkout-version=${MPGS_CHECKOUT_VERSION:62}
gadaa.mpgs.notification-secret=${MPGS_NOTIFICATION_SECRET: }

# --- JWT (HS256 via Nimbus JOSE — see JwtIssuer.java) ---
# Storefront tokens
gadaa.jwt.storefront-issuer=${GADAA_JWT_STOREFRONT_ISSUER:https://api.dev.gadaaistar.com/storefront}
gadaa.jwt.storefront-secret=${GADAA_JWT_STOREFRONT_SECRET:dev-storefront-secret-change-me-32-chars-min-length!}
# Admin tokens
gadaa.jwt.admin-issuer=${GADAA_JWT_ADMIN_ISSUER:https://api.dev.gadaaistar.com/admin}
gadaa.jwt.admin-secret=${GADAA_JWT_ADMIN_SECRET:dev-admin-secret-change-me-32-chars-min-length-abcdef!}
# Token TTLs
gadaa.jwt.access-ttl-minutes=${GADAA_JWT_ACCESS_TTL_MINUTES:15}
gadaa.jwt.refresh-ttl-days=${GADAA_JWT_REFRESH_TTL_DAYS:30}

# --- Frontend URLs (used to build verification / reset links) ---
gadaa.frontend.storefront-url=${STOREFRONT_BASE_URL:http://localhost:4200}
gadaa.frontend.admin-url=${ADMIN_BASE_URL:http://localhost:4300}

# --- Auth flows (email verification, password reset) ---
gadaa.auth.email-verification-ttl-minutes=${GADAA_EMAIL_VERIFICATION_TTL_MINUTES:60}
gadaa.auth.password-reset-ttl-minutes=${GADAA_PASSWORD_RESET_TTL_MINUTES:30}

# --- Rate limiting (Phase 4d.6: memory | redis) ---
# Global on/off switch. Turn off in load tests where the limiter itself is not
# what we want to measure.
gadaa.ratelimit.enabled=${GADAA_RATELIMIT_ENABLED:true}
# Backend selector. `memory` = single-instance sliding window (default;
# process-local ConcurrentHashMap). `redis` = Redis-backed sliding window via
# a Lua ZSET script (multi-instance safe). Fail-open on Redis errors — a
# Redis outage silently disables rate limiting rather than taking the site
# offline. Requires quarkus.redis.hosts.
gadaa.ratelimit.backend=${GADAA_RATELIMIT_BACKEND:memory}
# Safety cap per (bucket, client-ip) queue in memory mode — anything past
# this is dropped from the head to keep memory bounded under abuse.
gadaa.ratelimit.max-queue-size=${GADAA_RATELIMIT_MAX_QUEUE_SIZE:1024}

# --- Distributed lease (Phase 4d.6) ---
# Used by the abandoned-order sweeper to prevent overlapping runs across
# replicas. `memory` = no-op success (single-instance deploys; the in-JVM
# AtomicBoolean already prevents concurrent runs). `redis` = SET NX PX +
# check-and-delete on release (multi-instance safe). Fail-CLOSED on Redis
# errors — better to skip a sweep than have every replica sweep at once.
gadaa.leases.backend=${GADAA_LEASES_BACKEND:memory}

# --- Redis client (used only if a Redis backend is opted-in above) ---
# Comma-separated list of Redis hosts. Left commented so the Redis client
# skips connection attempts on local dev unless someone explicitly enables
# it. Ops override in prod via QUARKUS_REDIS_HOSTS.
quarkus.redis.hosts=${QUARKUS_REDIS_HOSTS:redis://localhost:6379}
# Timeout for a single Redis command. Short so a Redis outage manifests
# quickly and we can log + fail-open on the rate limiter.
quarkus.redis.timeout=${QUARKUS_REDIS_TIMEOUT:2s}
# Disable Redis Dev Services (Testcontainers/Docker) — we run standalone
# locally without Docker. Set to true in CI/Docker environments.
quarkus.redis.devservices.enabled=false

# --- Abandoned-order sweeper (Phase 4d.3) ---
# Auto-cancels PENDING_PAYMENT orders whose customer never completed the
# CyberSource redirect, releasing their inventory reservations. See
# AbandonedOrderSweeper.java for the design notes.
gadaa.orders.abandoned-sweeper.enabled=${GADAA_ORDERS_SWEEPER_ENABLED:true}
# Minutes after placedAt before a PENDING_PAYMENT order is considered
# abandoned. CyberSource's own hosted page typically times out at 15 min,
# so 60 gives us a comfortable margin.
gadaa.orders.abandoned-sweeper.ttl-minutes=${GADAA_ORDERS_SWEEPER_TTL_MINUTES:60}
# Max orders processed per sweep run. Leftovers are picked up next sweep.
gadaa.orders.abandoned-sweeper.batch-size=${GADAA_ORDERS_SWEEPER_BATCH_SIZE:100}
# Sweep interval. Any Quarkus duration string ("30s", "5m", "1h", ...).
gadaa.orders.abandoned-sweeper.every=${GADAA_ORDERS_SWEEPER_EVERY:5m}

# --- Company tax profile (seeded on first boot) ---
gadaa.company.legal-name=${GADAA_COMPANY_LEGAL_NAME:Gadaa Istar Business Group S.C.}
gadaa.company.tin=${GADAA_COMPANY_TIN:}
gadaa.company.vat-number=${GADAA_COMPANY_VAT_NUMBER:}
gadaa.company.invoice-prefix=${GADAA_INVOICE_PREFIX:GI}
gadaa.company.credit-note-prefix=${GADAA_CREDIT_NOTE_PREFIX:CN}
gadaa.company.fiscal-year-start-month=${GADAA_FISCAL_YEAR_START_MONTH:7}

# =============================================================================
# Dev profile overrides
# =============================================================================
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.log.category."com.gadaaistar".level=DEBUG
%dev.quarkus.http.cors.origins=/.*/

# =============================================================================
# Test profile overrides
# =============================================================================
%test.quarkus.flyway.clean-at-start=true
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/GCOMERCE_test
%test.quarkus.mailer.mock=true
# Rate limiting off in tests — otherwise a burst of /auth/login test cases
# trips the limiter and fails unrelated assertions.
%test.gadaa.ratelimit.enabled=false
# Abandoned-order sweeper off in tests — otherwise a test that plants a
# PENDING_PAYMENT fixture with an old placed_at (or one that just waits
# a while) will see the row auto-cancelled mid-assertion. Individual
# integration tests can flip this back on and inject AbandonedOrderSweeper
# to call runNow() explicitly.
%test.gadaa.orders.abandoned-sweeper.enabled=false

# =============================================================================
# Prod profile overrides
# =============================================================================
%prod.quarkus.hibernate-orm.log.sql=false
%prod.quarkus.log.console.json=true
%prod.quarkus.log.level=INFO
