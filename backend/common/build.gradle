/*
 * common — shared DTOs, enums, exceptions, small utilities.
 * No Quarkus runtime here; kept as a pure library so other modules
 * can depend on it without dragging Quarkus baggage.
 */

apply plugin: 'java-library'

description = 'Shared DTOs, enums, exceptions, utilities'

dependencies {
    api 'jakarta.validation:jakarta.validation-api:3.1.0'
    api 'com.fasterxml.jackson.core:jackson-annotations:2.17.2'
    api 'org.slf4j:slf4j-api:2.0.16'
}
