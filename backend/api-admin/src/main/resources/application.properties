# =============================================================================
# Gadaa Istar Admin API — Quarkus configuration
#
# Second Quarkus runtime module. Shares the PostgreSQL schema with api-storefront
# but binds to port 8081 and mounts all endpoints under /api/admin/v1.
# =============================================================================

# --- App identity ---
quarkus.application.name=gadaa-istar-admin
quarkus.application.version=0.1.0-SNAPSHOT

# --- Scan shared library modules for CDI beans and @Provider classes ---
quarkus.index-dependency.web-common.group-id=com.gadaaistar
quarkus.index-dependency.web-common.artifact-id=web-common
quarkus.index-dependency.persistence.group-id=com.gadaaistar
quarkus.index-dependency.persistence.artifact-id=persistence

# --- HTTP ---
quarkus.http.port=${QUARKUS_ADMIN_HTTP_PORT:8081}
quarkus.http.cors=true
quarkus.http.cors.origins=${ADMIN_BASE_URL:http://localhost:4300}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=Accept,Authorization,Content-Type,Idempotency-Key,X-Requested-With,X-Correlation-Id
quarkus.http.cors.access-control-allow-credentials=true

# --- Datasource (same DB as storefront) ---
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${QUARKUS_DATASOURCE_USERNAME:postgres}
quarkus.datasource.password=${QUARKUS_DATASOURCE_PASSWORD:admin123}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_URL:jdbc:postgresql://localhost:5432/GCOMERCE}
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.min-size=2

# --- Hibernate ORM (schema is owned by api-storefront/Flyway; we only validate) ---
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# --- Flyway disabled here — api-storefront owns the migrations ---
quarkus.flyway.migrate-at-start=false
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migration

# --- OpenAPI / Swagger ---
quarkus.smallrye-openapi.info-title=Gadaa Istar Admin API
quarkus.smallrye-openapi.info-version=v1
quarkus.smallrye-openapi.info-description=Admin-only REST API for the Gadaa Istar export e-commerce platform.
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# --- Health / Metrics ---
quarkus.smallrye-health.root-path=/q/health
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# --- Mailer (defaults to MailHog in dev) ---
quarkus.mailer.from=${SMTP_FROM_ADDRESS:noreply@gadaaistar.com}
quarkus.mailer.host=${SMTP_HOST:localhost}
quarkus.mailer.port=${SMTP_PORT:1025}
quarkus.mailer.username=${SMTP_USERNAME:}
quarkus.mailer.password=${SMTP_PASSWORD:}
quarkus.mailer.start-tls=DISABLED
quarkus.mailer.mock=false

# --- Logging ---
quarkus.log.level=${QUARKUS_LOG_LEVEL:INFO}
quarkus.log.category."com.gadaaistar".level=DEBUG
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%c{2.}] (%t) %s%e%n

# --- JWT (HS256 via Nimbus JOSE — same keys as storefront module) ---
gadaa.jwt.storefront-issuer=${GADAA_JWT_STOREFRONT_ISSUER:https://api.dev.gadaaistar.com/storefront}
gadaa.jwt.storefront-secret=${GADAA_JWT_STOREFRONT_SECRET:dev-storefront-secret-change-me-32-chars-min-length!}
gadaa.jwt.admin-issuer=${GADAA_JWT_ADMIN_ISSUER:https://api.dev.gadaaistar.com/admin}
gadaa.jwt.admin-secret=${GADAA_JWT_ADMIN_SECRET:dev-admin-secret-change-me-32-chars-min-length-abcdef!}
gadaa.jwt.access-ttl-minutes=${GADAA_JWT_ACCESS_TTL_MINUTES:15}
gadaa.jwt.refresh-ttl-days=${GADAA_JWT_REFRESH_TTL_DAYS:30}

# --- MFA (TOTP) ---
gadaa.admin.mfa.issuer=${GADAA_ADMIN_MFA_ISSUER:Gadaa Istar Admin}
# Short-lived challenge JWT (issued between /login and /verify-mfa)
gadaa.admin.mfa.challenge-ttl-seconds=${GADAA_ADMIN_MFA_CHALLENGE_TTL_SECONDS:300}
# Number of past/future 30-second windows we accept during verification
gadaa.admin.mfa.window-tolerance=${GADAA_ADMIN_MFA_WINDOW_TOLERANCE:1}

# --- Admin-initiated customer password reset ---
# TTL of the one-shot reset link (minutes). Longer than the storefront default
# because the admin may issue the link during business hours for a customer
# in a different timezone.
gadaa.auth.admin-password-reset-ttl-minutes=${GADAA_ADMIN_PASSWORD_RESET_TTL_MINUTES:60}
# Storefront base URL used to build the reset link (same domain the customer
# uses to sign in — NOT the admin app).
gadaa.frontend.storefront-url=${STOREFRONT_BASE_URL:https://gedaaistar.et}

# --- Object storage (MinIO in dev; S3 / R2 / Wasabi in prod) ---
# The "endpoint" is the backend-to-storage URL (used by the MinIO Java SDK).
# The "public-base-url" is the browser-facing URL prefix the frontend uses to
# actually render <img src="..."> — in dev it points at http://localhost:9000
# because docker-compose exposes MinIO there; in prod it's the CDN hostname.
gadaa.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
gadaa.s3.public-base-url=${S3_PUBLIC_BASE_URL:http://localhost:9000}
gadaa.s3.region=${S3_REGION:us-east-1}
gadaa.s3.access-key=${S3_ACCESS_KEY:minio}
gadaa.s3.secret-key=${S3_SECRET_KEY:minio_dev_pw}
gadaa.s3.bucket-media=${S3_BUCKET_MEDIA:gadaa-media}
# Max product-media upload size in bytes (default 20 MB). Enforced in the
# resource layer before we stream the payload to storage.
gadaa.s3.max-upload-bytes=${S3_MAX_UPLOAD_BYTES:20971520}

# Ensure RESTEasy Reactive keeps multipart bodies on disk (streamed) rather
# than fully in memory. Prevents OOM when admins upload large videos.
quarkus.http.limits.max-body-size=25M

# --- Coupon report notifications ---
# Email address that receives coupon expiry warnings and usage reports.
gadaa.coupon.notification-email=${GADAA_COUPON_NOTIFICATION_EMAIL:finance@gadaaistar.com}

# --- CyberSource REST API (refunds) ---
# Credentials default to empty — refund service falls back to MANUAL mode.
# Set env vars to enable gateway refunds.
gadaa.cybersource.rest.host=${CYBERSOURCE_REST_HOST:apitest.cybersource.com}
gadaa.cybersource.rest.merchant-id=${CYBERSOURCE_MERCHANT_ID: }
gadaa.cybersource.rest.key-id=${CYBERSOURCE_REST_KEY_ID: }
gadaa.cybersource.rest.secret-key=${CYBERSOURCE_REST_SECRET_KEY: }
gadaa.cybersource.rest.timeout-seconds=${CYBERSOURCE_REST_TIMEOUT_SECONDS:30}

# --- MPGS REST API (refunds) ---
# Credentials default to empty — refund service falls back to MANUAL mode.
gadaa.mpgs.gateway-url=${MPGS_GATEWAY_URL:https://mtf.gateway.mastercard.com}
gadaa.mpgs.merchant-id=${MPGS_MERCHANT_ID: }
gadaa.mpgs.api-password=${MPGS_API_PASSWORD: }
gadaa.mpgs.api-version=${MPGS_API_VERSION:100}
gadaa.mpgs.timeout-seconds=${MPGS_TIMEOUT_SECONDS:30}

# Admin frontend URL for building deep links in report emails.
gadaa.frontend.admin-url=${ADMIN_BASE_URL:http://localhost:4300}
# Expiry check: look this many days ahead for soon-to-expire coupons.
gadaa.coupon.expiry-check.enabled=${GADAA_COUPON_EXPIRY_CHECK_ENABLED:true}
gadaa.coupon.expiry-check.warning-days=${GADAA_COUPON_EXPIRY_WARNING_DAYS:7}
gadaa.coupon.expiry-check.cron=${GADAA_COUPON_EXPIRY_CRON:0 0 8 * * ?}
# Usage report: periodic summary of coupon redemption activity.
gadaa.coupon.usage-report.enabled=${GADAA_COUPON_USAGE_REPORT_ENABLED:true}
gadaa.coupon.usage-report.report-days=${GADAA_COUPON_USAGE_REPORT_DAYS:7}
gadaa.coupon.usage-report.cron=${GADAA_COUPON_USAGE_REPORT_CRON:0 0 9 ? * MON}

# =============================================================================
# Dev profile overrides
# =============================================================================
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.log.category."com.gadaaistar".level=DEBUG
%dev.quarkus.http.cors.origins=/.*/

# =============================================================================
# Test profile overrides
# =============================================================================
%test.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/GCOMERCE_test
%test.quarkus.mailer.mock=true

# =============================================================================
# Prod profile overrides
# =============================================================================
%prod.quarkus.hibernate-orm.log.sql=false
%prod.quarkus.log.console.json=true
%prod.quarkus.log.level=INFO
