# Gadaa Istar Backend — Gradle configuration

# --- Toolchain ---
javaVersion=21

# --- Quarkus ---
quarkusPluginVersion=3.15.1
quarkusPlatformArtifactId=quarkus-bom
quarkusPlatformGroupId=io.quarkus.platform
quarkusPlatformVersion=3.15.1

# --- Dependencies ---
postgresqlVersion=42.7.4
flywayVersion=10.17.0
lombokVersion=1.18.34
mapstructVersion=1.6.0
bcryptVersion=0.10.2

# --- Gradle performance ---
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache disabled — Quarkus's quarkusGenerateCodeTests task is
# incompatible with it (writes a non-serializable DefaultLegacyConfiguration).
org.gradle.configuration-cache=false
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError \
  -Dhttp.socketTimeout=600000 -Dhttp.connectionTimeout=600000 \
  -Dhttps.socketTimeout=600000 -Dhttps.connectionTimeout=600000 \
  -Dorg.gradle.internal.http.socketTimeout=600000 \
  -Dorg.gradle.internal.http.connectionTimeout=600000
