# Nginx config for the admin SPA (internal-only; noindex).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Never let bots or CDNs cache admin HTML
  # Security headers must be repeated here — Nginx does NOT inherit
  # add_header from the server block when a location has its own add_header.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    expires 0;
  }

  location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico|map)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    # Security headers must be repeated here — Nginx does NOT inherit
    # add_header from the server block when a location has its own add_header.
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Extra-strict headers for admin surface (server-level — inherited by
  # location blocks that do NOT have their own add_header).
  add_header Content-Security-Policy "frame-ancestors 'self'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Robots-Tag "noindex, nofollow" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}
