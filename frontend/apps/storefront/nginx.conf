# Nginx config for the storefront static bundle (used inside the container).
# For SSR, replace with a Node runtime that runs `node server.mjs`.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Static assets: aggressive caching
  location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico|map)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000, immutable" always;
    # Security headers must be repeated here — Nginx does NOT inherit
    # add_header from the server block when a location has its own add_header.
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    try_files $uri =404;
  }

  # HTML: no cache (so deployments propagate instantly)
  # Security headers must be repeated here — Nginx does NOT inherit
  # add_header from the server block when a location has its own add_header.
  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    expires 0;
  }

  # SPA fallback — every unmatched request returns the Angular shell
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Security headers (server-level — inherited by location blocks that
  # do NOT have their own add_header, e.g. location / above).
  add_header Content-Security-Policy "frame-ancestors 'self'" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
}
